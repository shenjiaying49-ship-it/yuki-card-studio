<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUKI AI · Card Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --ui-bg: #080810;
  --ui-panel: #0d0d18;
  --ui-panel2: #111120;
  --ui-border: #1e1e32;
  --ui-accent: #00d4ff;
  --ui-accent-dim: rgba(0,212,255,0.15);
  --ui-text: #b8bcd8;
  --ui-text-dim: #454868;
  --card-bg: #0c0c18;
  --card-text: #f0f0f8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--ui-bg);
  color: var(--ui-text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER ===== */
.header {
  height: 44px;
  background: var(--ui-panel);
  border-bottom: 1px solid var(--ui-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  flex-shrink: 0;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  font-family: 'Courier New', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.25em;
  color: var(--ui-accent);
}

.brand-divider {
  width: 1px;
  height: 14px;
  background: var(--ui-border);
}

.brand-title {
  font-size: 11px;
  color: var(--ui-text-dim);
  letter-spacing: 0.12em;
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ui-accent);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ===== MAIN LAYOUT ===== */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ===== EDITOR PANEL ===== */
.editor-panel {
  width: 360px;
  flex-shrink: 0;
  background: var(--ui-panel);
  border-right: 1px solid var(--ui-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.editor-section {
  padding: 12px 14px;
  border-bottom: 1px solid var(--ui-border);
}

.section-label {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--ui-text-dim);
  text-transform: uppercase;
  font-family: 'Courier New', monospace;
  margin-bottom: 7px;
}

.input-field {
  width: 100%;
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--ui-border);
  border-radius: 3px;
  color: var(--ui-text);
  font-family: inherit;
  font-size: 13px;
  padding: 7px 10px;
  outline: none;
  transition: border-color 0.2s;
}

.input-field:focus {
  border-color: var(--ui-accent);
  background: rgba(0,212,255,0.03);
}

.input-field::placeholder {
  color: var(--ui-text-dim);
  font-size: 12px;
}

.input-row {
  display: flex;
  gap: 8px;
}

.input-row .input-field {
  flex: 1;
}

/* Cover image drop zone */
.cover-drop-zone {
  width: 100%;
  height: 72px;
  border: 1px dashed var(--ui-border);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  background: rgba(0,0,0,0.2);
}

.cover-drop-zone:hover {
  border-color: var(--ui-accent);
  background: var(--ui-accent-dim);
}

.cover-drop-zone.has-image .drop-placeholder {
  display: none;
}

.cover-drop-zone img.drop-preview {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.9;
}

.cover-drop-zone .drop-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
}

.cover-drop-zone.has-image .drop-overlay {
  display: flex;
}

.drop-placeholder {
  text-align: center;
}

.drop-placeholder .drop-icon {
  font-size: 18px;
  margin-bottom: 3px;
  opacity: 0.4;
}

.drop-placeholder span {
  display: block;
  font-size: 10px;
  color: var(--ui-text-dim);
  letter-spacing: 0.05em;
}

.drop-change-btn {
  background: rgba(0,0,0,0.6);
  border: 1px solid var(--ui-border);
  color: var(--ui-text);
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 3px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.05em;
}

#cover-file-input { display: none; }

/* Body textarea */
.body-area-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-bottom: 1px solid var(--ui-border);
}

.body-area-header {
  padding: 8px 14px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.body-area-help {
  font-size: 9px;
  color: var(--ui-text-dim);
  font-family: 'Courier New', monospace;
}

.body-textarea {
  flex: 1;
  resize: none;
  background: transparent;
  border: none;
  color: var(--ui-text);
  font-family: 'Courier New', 'Menlo', monospace;
  font-size: 12px;
  line-height: 1.75;
  padding: 10px 14px 14px;
  outline: none;
  overflow-y: auto;
}

.body-textarea::placeholder {
  color: var(--ui-text-dim);
  font-size: 11px;
  line-height: 1.8;
}

/* Editor footer */
.editor-footer {
  padding: 10px 14px;
  display: flex;
  gap: 7px;
}

.btn {
  padding: 7px 14px;
  border-radius: 3px;
  font-size: 11px;
  cursor: pointer;
  border: none;
  font-family: 'Courier New', monospace;
  font-weight: 700;
  letter-spacing: 0.1em;
  transition: all 0.15s;
  text-transform: uppercase;
}

.btn-primary {
  background: var(--ui-accent);
  color: #000;
  flex: 1;
}

.btn-primary:hover {
  background: #22e0ff;
  transform: translateY(-1px);
  box-shadow: 0 0 12px rgba(0,212,255,0.3);
}

.btn-secondary {
  background: var(--ui-border);
  color: var(--ui-text);
  padding: 7px 12px;
}

.btn-secondary:hover {
  background: #282840;
  color: var(--ui-accent);
}

.btn-export {
  background: transparent;
  color: var(--ui-accent);
  border: 1px solid var(--ui-accent);
  padding: 5px 12px;
  font-size: 10px;
  letter-spacing: 0.15em;
}

.btn-export:hover {
  background: var(--ui-accent-dim);
}

/* ===== PREVIEW PANEL ===== */
.preview-panel {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  background: #060610;
}

.preview-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: flex-start;
}

.card-preview-item {
  position: relative;
}

.card-preview-label {
  font-size: 9px;
  color: var(--ui-text-dim);
  font-family: 'Courier New', monospace;
  letter-spacing: 0.12em;
  margin-bottom: 5px;
}

.card-frame {
  width: 270px;
  height: 360px;
  overflow: hidden;
  border-radius: 4px;
  box-shadow:
    0 4px 20px rgba(0,0,0,0.5),
    0 0 0 1px rgba(0,212,255,0.08);
  cursor: pointer;
  transition: box-shadow 0.2s;
}

.card-frame:hover {
  box-shadow:
    0 4px 20px rgba(0,0,0,0.5),
    0 0 0 1px rgba(0,212,255,0.3),
    0 0 20px rgba(0,212,255,0.05);
}

.card-frame > .card {
  transform-origin: top left;
  transform: scale(0.25);
  width: 1080px;
  height: 1440px;
}

.card-actions {
  position: absolute;
  right: -32px;
  top: 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.icon-btn {
  width: 26px;
  height: 26px;
  background: var(--ui-panel2);
  border: 1px solid var(--ui-border);
  border-radius: 3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ui-text-dim);
  font-size: 12px;
  transition: all 0.15s;
  user-select: none;
}

.icon-btn:hover {
  border-color: var(--ui-accent);
  color: var(--ui-accent);
}

.preview-empty {
  width: 100%;
  padding: 60px 20px;
  text-align: center;
}

.preview-empty .empty-icon {
  font-size: 36px;
  margin-bottom: 12px;
  opacity: 0.15;
}

.preview-empty p {
  font-size: 12px;
  color: var(--ui-text-dim);
  line-height: 1.7;
  font-family: 'Courier New', monospace;
}

/* ===== THE CARDS (1080×1440) ===== */

.card {
  position: relative;
  width: 1080px;
  height: 1440px;
  font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif;
  overflow: hidden;
}

/* Scanline overlay on all cards */
.card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    rgba(0,212,255,0.008) 2px,
    rgba(0,212,255,0.008) 3px
  );
  pointer-events: none;
  z-index: 20;
}

/* ---- COVER CARD ---- */
.card-cover {
  background: #05050f;
}

.cover-bg-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* CSS sci-fi fallback background */
.cover-bg-fallback {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 25% 25%, rgba(0,80,180,0.2) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 75% 70%, rgba(0,40,120,0.15) 0%, transparent 60%),
    linear-gradient(135deg, #04040e 0%, #070715 40%, #050510 100%);
}

.cover-bg-fallback::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
  background-size: 72px 72px;
}

.cover-bg-fallback::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle, rgba(0,212,255,0.06) 1px, transparent 1px);
  background-size: 36px 36px;
  background-position: 18px 18px;
}

.cover-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(4,4,18,0.25) 0%,
    rgba(4,4,18,0.15) 25%,
    rgba(4,4,18,0.45) 55%,
    rgba(4,4,18,0.82) 80%,
    rgba(4,4,18,0.92) 100%
  );
  z-index: 2;
}

/* Top accent line */
.cover-accent-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--ui-accent) 30%, var(--ui-accent) 70%, transparent 100%);
  z-index: 5;
}

/* Top logo area */
.cover-header {
  position: absolute;
  top: 72px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  z-index: 5;
}

.cover-logo {
  text-align: center;
}

.cover-logo-main {
  display: block;
  font-family: 'Courier New', monospace;
  font-size: 52px;
  font-weight: 900;
  letter-spacing: 0.2em;
  color: #ffffff;
  line-height: 1;
  text-shadow: 0 0 40px rgba(0,212,255,0.3);
}

.cover-logo-sub {
  display: block;
  font-family: 'Courier New', monospace;
  font-size: 34px;
  font-weight: 400;
  letter-spacing: 0.45em;
  color: #00d4ff;
  line-height: 1.2;
  text-shadow: 0 0 20px rgba(0,212,255,0.5);
}

/* Bottom title area */
.cover-body {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 0 80px 110px;
  z-index: 5;
}

.cover-title {
  font-size: 92px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.15;
  margin-bottom: 28px;
  letter-spacing: -0.015em;
  word-break: break-all;
}

.cover-subtitle {
  font-size: 30px;
  color: rgba(255,255,255,0.5);
  font-style: italic;
  font-weight: 300;
  letter-spacing: 0.06em;
  line-height: 1.5;
}

/* ---- CONTENT CARD ---- */
.card-content {
  background: #0c0c1a;
  display: flex;
  flex-direction: column;
}

/* Grid texture */
.content-grid-texture {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.012) 1px, transparent 1px);
  background-size: 90px 90px;
  pointer-events: none;
  z-index: 0;
}

/* Accent line at top */
.content-accent-top {
  position: absolute;
  top: 0;
  left: 80px;
  right: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.35), transparent);
  z-index: 2;
}

.content-body {
  flex: 1;
  padding: 96px 80px 52px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  position: relative;
  z-index: 2;
  overflow: hidden;
}

/* Section heading (first line if starts with heading marker) */
.content-heading {
  font-size: 60px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.2;
  margin-bottom: 60px;
  letter-spacing: -0.01em;
}

/* Number point marker */
.content-number-marker {
  font-family: 'Courier New', monospace;
  font-size: 52px;
  font-weight: 800;
  color: #00d4ff;
  line-height: 1;
  margin-bottom: 18px;
}

/* Regular paragraph */
.content-para {
  font-size: 40px;
  line-height: 1.85;
  color: rgba(240,240,252,0.88);
  margin-bottom: 48px;
  font-weight: 400;
  letter-spacing: 0.015em;
  word-break: break-all;
}

.content-para:last-child {
  margin-bottom: 0;
}

/* Divider (before 实用影子) */
.content-divider {
  width: 48px;
  height: 2px;
  background: linear-gradient(90deg, #00d4ff, transparent);
  margin: 20px 0 44px;
  opacity: 0.5;
}

/* Utility shadow / 实用影子 block */
.content-utility {
  background: rgba(0,212,255,0.04);
  border: 1px solid rgba(0,212,255,0.12);
  border-radius: 6px;
  padding: 40px 44px;
  margin-bottom: 24px;
}

.content-utility .content-para {
  font-size: 36px;
  color: rgba(240,240,252,0.75);
}

/* Signature block */
.content-signature {
  margin-top: auto;
  padding-top: 32px;
  font-size: 32px;
  color: rgba(240,240,252,0.4);
  line-height: 1.7;
  font-weight: 300;
}

.content-signature strong {
  color: rgba(240,240,252,0.6);
  font-weight: 600;
}

/* Card footer (logo) */
.card-footer {
  padding: 36px 80px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-top: 1px solid rgba(0,212,255,0.07);
  position: relative;
  z-index: 2;
  flex-shrink: 0;
}

.footer-logo {
  text-align: center;
}

.footer-logo-main {
  display: block;
  font-family: 'Courier New', monospace;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 0.22em;
  color: rgba(240,240,252,0.9);
  line-height: 1;
}

.footer-logo-sub {
  display: block;
  font-family: 'Courier New', monospace;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.42em;
  color: #00d4ff;
  line-height: 1.5;
}

/* ===== FULL-SIZE RENDER AREA (hidden) ===== */
#render-area {
  position: fixed;
  top: -99999px;
  left: -99999px;
  width: 1080px;
  pointer-events: none;
  z-index: -999;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ui-border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: #2a2a45; }

/* Export toast */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--ui-panel2);
  border: 1px solid var(--ui-accent);
  color: var(--ui-accent);
  font-family: 'Courier New', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  padding: 10px 16px;
  border-radius: 4px;
  z-index: 1000;
  animation: slideIn 0.2s ease;
  box-shadow: 0 0 20px rgba(0,212,255,0.15);
}

@keyframes slideIn {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-brand">
    <span class="brand-logo">YUKI AI</span>
    <div class="brand-divider"></div>
    <span class="brand-title">CARD STUDIO · v1.0</span>
  </div>
  <div class="header-actions">
    <div class="status-dot"></div>
    <button class="btn btn-export" onclick="exportAll()">↓ EXPORT ALL</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- EDITOR PANEL -->
  <div class="editor-panel">

    <!-- Title & Subtitle -->
    <div class="editor-section">
      <div class="section-label">封面标题</div>
      <input type="text" id="input-title" class="input-field" placeholder="封面大标题（直接显示在封面）" />
    </div>

    <div class="editor-section">
      <div class="section-label">英文副标题</div>
      <input type="text" id="input-subtitle" class="input-field" placeholder='e.g. "AI Workflow Series, No.7"' />
    </div>

    <!-- Cover image -->
    <div class="editor-section">
      <div class="section-label">封面图（Midjourney / 本地图片）</div>
      <div class="cover-drop-zone" id="cover-drop-zone" onclick="triggerCoverUpload()">
        <div class="drop-placeholder">
          <div class="drop-icon">⬡</div>
          <span>拖入图片 or 点击上传</span>
          <span style="margin-top:2px; color: rgba(0,212,255,0.4);">像素科幻风 Midjourney 图最佳</span>
        </div>
        <img id="cover-preview-img" class="drop-preview" style="display:none" />
        <div class="drop-overlay">
          <button class="drop-change-btn" onclick="event.stopPropagation(); triggerCoverUpload()">更换图片</button>
        </div>
      </div>
      <input type="file" id="cover-file-input" accept="image/*" onchange="handleCoverFile(this)" />
    </div>

    <!-- Body text -->
    <div class="body-area-wrap">
      <div class="body-area-header">
        <div class="section-label">正文内容</div>
        <div class="body-area-help">
          === 强制换卡 · --- 实用影子分隔 · 1/2/3 单独一行=分点编号
        </div>
      </div>
      <textarea
        id="body-text"
        class="body-textarea"
        placeholder="在这里粘贴小红书文案...

支持格式：
1（单独一行）→ 蓝色分点编号
=== → 强制换下一张卡片
--- → 实用影子分割线（特殊卡片）

文案示例：

上周一个做 AI 的朋友跟我说，他的团队现在每
天花 3 小时调试提示词，反而忘了产品本来要解
决什么问题。

1

工具是放大器，不是答案。
装得越多，思路越散。

2

先搞清楚你在解决谁的什么问题，
再决定用不用 AI 工具。

===

---
实用影子：上线新工具前，先写下：
这个工具解决的是「谁的什么具体问题」。

—
@Yuki
大厂裸辞 | AI startup BD | 聊点别人不说的真话"
      ></textarea>
    </div>

    <!-- Footer controls -->
    <div class="editor-footer">
      <button class="btn btn-secondary" onclick="clearAll()">CLR</button>
      <button class="btn btn-primary" onclick="generateCards()">⟳ GENERATE CARDS</button>
    </div>
  </div>

  <!-- PREVIEW PANEL -->
  <div class="preview-panel" id="preview-panel">
    <div class="preview-empty" id="preview-empty">
      <div class="empty-icon">◈</div>
      <p>填入文案后<br>点击 GENERATE CARDS<br>实时预览小红书卡片</p>
    </div>
    <div class="preview-grid" id="preview-grid" style="display:none;"></div>
  </div>
</div>

<!-- RENDER AREA (hidden full-size cards for export) -->
<div id="render-area"></div>

<script>
let coverImageData = null;
let currentCards = [];

// ===== Cover image handling =====
function triggerCoverUpload() {
  document.getElementById('cover-file-input').click();
}

function handleCoverFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    coverImageData = e.target.result;
    const preview = document.getElementById('cover-preview-img');
    const zone = document.getElementById('cover-drop-zone');
    preview.src = coverImageData;
    preview.style.display = 'block';
    zone.classList.add('has-image');
  };
  reader.readAsDataURL(file);
}

// Drag & drop on cover zone
const dropZone = document.getElementById('cover-drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = 'var(--ui-accent)'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.style.borderColor = '';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = ev => {
      coverImageData = ev.target.result;
      const preview = document.getElementById('cover-preview-img');
      const zone = document.getElementById('cover-drop-zone');
      preview.src = coverImageData;
      preview.style.display = 'block';
      zone.classList.add('has-image');
    };
    reader.readAsDataURL(file);
  }
});

// ===== Content Parser =====
function parseBody(text) {
  /*
    Returns array of "card segment groups".
    Each group = array of segments:
      { type: 'heading' | 'text' | 'number' | 'divider' | 'utility' | 'signature', text: string }
  */
  const lines = text.split('\n');
  const allSegments = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i].trim();

    if (line === '===') {
      allSegments.push({ type: 'hard-break' });
      i++;
      continue;
    }

    if (line === '---') {
      allSegments.push({ type: 'divider' });
      i++;
      continue;
    }

    if (/^[0-9]+$/.test(line) && line.length <= 2) {
      allSegments.push({ type: 'number', text: line });
      i++;
      continue;
    }

    // Signature block (starts with — or @)
    if (line.startsWith('—') || line.startsWith('@Yuki') || line.startsWith('@yuki')) {
      let sigLines = [];
      while (i < lines.length && lines[i].trim() !== '') {
        sigLines.push(lines[i].trim());
        i++;
      }
      allSegments.push({ type: 'signature', text: sigLines.join('\n') });
      continue;
    }

    if (line === '') {
      i++;
      continue;
    }

    // Regular text paragraph - collect multi-lines
    let paraLines = [];
    while (i < lines.length && lines[i].trim() !== '') {
      const l = lines[i].trim();
      if (['===', '---'].includes(l) || /^[0-9]+$/.test(l)) break;
      if (l.startsWith('—') || l.startsWith('@Yuki')) break;
      paraLines.push(l);
      i++;
    }
    if (paraLines.length > 0) {
      allSegments.push({ type: 'text', text: paraLines.join('\n') });
    }
  }

  // Now split into cards
  const cards = [];
  let current = [];
  let charCount = 0;
  let textCount = 0;
  let afterDivider = false;

  for (const seg of allSegments) {
    if (seg.type === 'hard-break') {
      if (current.length > 0) { cards.push([...current]); current = []; charCount = 0; textCount = 0; afterDivider = false; }
      continue;
    }

    if (seg.type === 'divider') {
      // Divider marks start of 实用影子 - put on same card or new
      if (current.length > 0) { cards.push([...current]); current = []; charCount = 0; textCount = 0; }
      afterDivider = true;
      current.push(seg);
      continue;
    }

    if (seg.type === 'signature') {
      current.push(seg);
      cards.push([...current]);
      current = []; charCount = 0; textCount = 0; afterDivider = false;
      continue;
    }

    if (seg.type === 'number') {
      // Number always starts a new logical unit - auto-break if already have content
      if (textCount >= 2 || charCount > 220) {
        cards.push([...current]); current = []; charCount = 0; textCount = 0;
      }
      current.push(seg);
      continue;
    }

    if (seg.type === 'text') {
      charCount += seg.text.length;
      textCount++;
      current.push(seg);

      // Auto-split: ~2 paragraphs or ~280 chars per card (unless after divider = utility card)
      if (!afterDivider && (textCount >= 2 || charCount > 280)) {
        // Peek: if next segment is a number, split now
        const nextIdx = allSegments.indexOf(seg) + 1;
        cards.push([...current]); current = []; charCount = 0; textCount = 0;
      }
      continue;
    }
  }

  if (current.length > 0) cards.push(current);
  return cards;
}

// ===== Card Renderer =====
function buildCoverCard(title, subtitle, imageData) {
  const card = document.createElement('div');
  card.className = 'card card-cover';

  const accentTop = document.createElement('div');
  accentTop.className = 'cover-accent-top';
  card.appendChild(accentTop);

  if (imageData) {
    const img = document.createElement('img');
    img.className = 'cover-bg-image';
    img.src = imageData;
    card.appendChild(img);
  } else {
    const fallback = document.createElement('div');
    fallback.className = 'cover-bg-fallback';
    card.appendChild(fallback);
  }

  const overlay = document.createElement('div');
  overlay.className = 'cover-overlay';
  card.appendChild(overlay);

  // Top logo
  const header = document.createElement('div');
  header.className = 'cover-header';
  header.innerHTML = `<div class="cover-logo">
    <span class="cover-logo-main">YUKI</span>
    <span class="cover-logo-sub">AI</span>
  </div>`;
  card.appendChild(header);

  // Bottom content
  const body = document.createElement('div');
  body.className = 'cover-body';
  body.innerHTML = `
    <div class="cover-title">${escHtml(title || '标题')}</div>
    ${subtitle ? `<div class="cover-subtitle">${escHtml(subtitle)}</div>` : ''}
  `;
  card.appendChild(body);

  return card;
}

function buildContentCard(segments) {
  const card = document.createElement('div');
  card.className = 'card card-content';

  const texture = document.createElement('div');
  texture.className = 'content-grid-texture';
  card.appendChild(texture);

  const accentTop = document.createElement('div');
  accentTop.className = 'content-accent-top';
  card.appendChild(accentTop);

  const body = document.createElement('div');
  body.className = 'content-body';

  let inUtility = false;
  let utilityDiv = null;

  for (const seg of segments) {
    if (seg.type === 'divider') {
      if (!inUtility) {
        const div = document.createElement('div');
        div.className = 'content-divider';
        body.appendChild(div);
        utilityDiv = document.createElement('div');
        utilityDiv.className = 'content-utility';
        body.appendChild(utilityDiv);
        inUtility = true;
      }
      continue;
    }

    if (seg.type === 'number') {
      const el = document.createElement('div');
      el.className = 'content-number-marker';
      el.textContent = seg.text;
      body.appendChild(el);
      continue;
    }

    if (seg.type === 'signature') {
      const sig = document.createElement('div');
      sig.className = 'content-signature';
      const lines = seg.text.split('\n');
      sig.innerHTML = lines.map((l, i) => {
        if (i === 0) return `<div>${escHtml(l)}</div>`;
        return `<div>${escHtml(l)}</div>`;
      }).join('');
      body.appendChild(sig);
      continue;
    }

    if (seg.type === 'text') {
      const el = document.createElement('div');
      el.className = 'content-para';
      el.textContent = seg.text;
      if (inUtility && utilityDiv) {
        utilityDiv.appendChild(el);
      } else {
        body.appendChild(el);
      }
      continue;
    }
  }

  card.appendChild(body);

  // Footer logo
  const footer = document.createElement('div');
  footer.className = 'card-footer';
  footer.innerHTML = `<div class="footer-logo">
    <span class="footer-logo-main">YUKI</span>
    <span class="footer-logo-sub">AI</span>
  </div>`;
  card.appendChild(footer);

  return card;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== Generate & Render =====
function generateCards() {
  const title = document.getElementById('input-title').value.trim();
  const subtitle = document.getElementById('input-subtitle').value.trim();
  const body = document.getElementById('body-text').value;

  const cardGroups = parseBody(body);

  currentCards = [];
  currentCards.push({ type: 'cover', title, subtitle, image: coverImageData });
  cardGroups.forEach(segs => currentCards.push({ type: 'content', segments: segs }));

  renderPreviews();
}

function renderPreviews() {
  const grid = document.getElementById('preview-grid');
  const empty = document.getElementById('preview-empty');
  grid.innerHTML = '';

  if (currentCards.length === 0) {
    empty.style.display = 'block';
    grid.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  grid.style.display = 'flex';

  currentCards.forEach((cardData, idx) => {
    const item = document.createElement('div');
    item.className = 'card-preview-item';

    const label = document.createElement('div');
    label.className = 'card-preview-label';
    label.textContent = `CARD ${String(idx + 1).padStart(2, '0')} / ${currentCards.length}`;
    item.appendChild(label);

    const frame = document.createElement('div');
    frame.className = 'card-frame';

    const cardEl = buildCard(cardData);
    frame.appendChild(cardEl);
    frame.onclick = () => exportSingleCard(idx);
    item.appendChild(frame);

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const dlBtn = document.createElement('div');
    dlBtn.className = 'icon-btn';
    dlBtn.title = '下载此卡片';
    dlBtn.textContent = '↓';
    dlBtn.onclick = (e) => { e.stopPropagation(); exportSingleCard(idx); };
    actions.appendChild(dlBtn);
    item.appendChild(actions);

    grid.appendChild(item);
  });
}

function buildCard(cardData) {
  if (cardData.type === 'cover') {
    return buildCoverCard(cardData.title, cardData.subtitle, cardData.image);
  } else {
    return buildContentCard(cardData.segments);
  }
}

// ===== Export =====
async function exportSingleCard(idx) {
  if (!window.html2canvas) {
    showToast('⚠ 需要联网以使用 html2canvas，或改用截图工具');
    return;
  }

  const renderArea = document.getElementById('render-area');
  renderArea.innerHTML = '';

  const cardData = currentCards[idx];
  const cardEl = buildCard(cardData);
  cardEl.style.position = 'relative';
  renderArea.appendChild(cardEl);

  showToast(`正在导出 CARD ${String(idx+1).padStart(2,'0')}...`);

  try {
    const canvas = await html2canvas(cardEl, {
      width: 1080,
      height: 1440,
      scale: 2,
      useCORS: true,
      backgroundColor: null,
      logging: false
    });

    const link = document.createElement('a');
    link.download = `yuki-ai-card-${String(idx+1).padStart(2,'0')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();

    showToast(`✓ CARD ${String(idx+1).padStart(2,'0')} 已导出`);
  } catch(e) {
    showToast('导出失败: ' + e.message);
  }

  renderArea.innerHTML = '';
}

async function exportAll() {
  if (currentCards.length === 0) {
    generateCards();
  }
  if (!window.html2canvas) {
    showToast('⚠ 需要联网加载 html2canvas');
    return;
  }

  showToast(`开始导出全部 ${currentCards.length} 张卡片...`);

  for (let i = 0; i < currentCards.length; i++) {
    await exportSingleCard(i);
    await new Promise(r => setTimeout(r, 300));
  }

  showToast(`✓ 全部 ${currentCards.length} 张卡片导出完成`);
}

function clearAll() {
  if (!confirm('清空所有内容？')) return;
  document.getElementById('input-title').value = '';
  document.getElementById('input-subtitle').value = '';
  document.getElementById('body-text').value = '';
  coverImageData = null;
  const preview = document.getElementById('cover-preview-img');
  const zone = document.getElementById('cover-drop-zone');
  preview.style.display = 'none';
  zone.classList.remove('has-image');
  currentCards = [];
  document.getElementById('preview-grid').style.display = 'none';
  document.getElementById('preview-empty').style.display = 'block';
  document.getElementById('preview-grid').innerHTML = '';
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2800);
}

// Auto-generate on Ctrl/Cmd+Enter
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') generateCards();
});

// Initial placeholder generation
window.addEventListener('load', () => {
  // Show instructions
});
</script>
